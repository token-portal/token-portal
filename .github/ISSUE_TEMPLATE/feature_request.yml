name: Feature request
description: Something the plugin should do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like it to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What are you trying to get done?
      description: The job behind the feature — often there is a shorter way to it.
